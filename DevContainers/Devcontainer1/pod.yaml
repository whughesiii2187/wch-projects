apiVersion: v1
kind: Pod
metadata:
  name: dev-pod
  labels:
    app: dev
spec:
  # Shared network namespace — devcontainer reaches Postgres at localhost:5432
  restartPolicy: Never

  volumes:
    - name: workspace
      hostPath:
        path: .
        type: Directory
    - name: pg-data
      persistentVolumeClaim:
        claimName: pg-data

  containers:
    # ── Postgres sidecar ──────────────────────────────────────────────────────
    - name: postgres
      image: docker.io/library/postgres:16-alpine
      env:
        - name: POSTGRES_USER
          value: dev
        - name: POSTGRES_PASSWORD
          value: dev
        - name: POSTGRES_DB
          value: devdb
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      ports:
        - containerPort: 5432
          hostPort: 5432
      volumeMounts:
        - name: pg-data
          mountPath: /var/lib/postgresql/data
      readinessProbe:
        exec:
          command: ["pg_isready", "-U", "dev", "-d", "devdb"]
        initialDelaySeconds: 5
        periodSeconds: 5

    # ── Dev container ─────────────────────────────────────────────────────────
    - name: devcontainer
      image: localhost/devcontainer:latest   # built via `make build`
      command: ["sleep", "infinity"]
      env:
        - name: DATABASE_URL
          value: postgres://dev:dev@localhost:5432/devdb?sslmode=disable
      volumeMounts:
        - name: workspace
          mountPath: /workspace

---
# Persistent volume claim for Postgres data (survives pod restarts)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
